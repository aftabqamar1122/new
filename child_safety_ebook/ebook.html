<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Keep Them Safe</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root { --navy:#0E1530; --navy2:#1D2A55; --yellow:#FFD000; --red:#FF3B3B; --light:#D9E2FF; --panel:#EEF2FF; --ink:#0E1530; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:#999; font-family:'Nunito',sans-serif; color:var(--ink); }
  .page { width:794px; height:1123px; margin:0 auto 20px; position:relative; overflow:hidden; background:#fff; page-break-after:always; }
  @page { size:794px 1123px; margin:0; }
  @media print { body { background:none; } .page { margin:0; } }
  .anton { font-family:'Anton',sans-serif; text-transform:uppercase; }

  /* ---------- cover ---------- */
  .cover { color:#fff; background:radial-gradient(circle at 70% 30%, #23305A 0%, #0E1530 60%, #070B1C 100%); }
  .tape { position:absolute; left:-40px; right:-40px; height:44px; color:#111; font:900 18px/44px 'Nunito'; letter-spacing:4px;
          white-space:nowrap; text-align:center; overflow:hidden; background:var(--yellow); box-shadow:0 6px 18px rgba(0,0,0,.4); }
  .cover .t1 { top:46px; transform:rotate(-4deg); }
  .cover .t2 { bottom:58px; transform:rotate(3deg); background:var(--red); color:#fff; letter-spacing:2px; font-size:17px; }
  .cover .wrap { position:absolute; top:130px; left:56px; right:56px; }
  .cover .q { font-family:'Anton',sans-serif; text-transform:uppercase; line-height:.95; font-size:104px; }
  .y { color:var(--yellow); } .r { color:var(--red); }
  .cover .sub { font-size:23px; font-weight:800; margin-top:18px; max-width:330px; line-height:1.35; color:var(--light); }
  .cover .sign { position:absolute; top:330px; right:-10px; }
  .cover .check { position:absolute; left:56px; right:56px; top:690px; background:#fff; color:var(--navy);
                  border-radius:22px; padding:22px 26px; box-shadow:0 10px 0 var(--yellow); }
  .cover .check h3 { font:900 20px 'Nunito'; letter-spacing:1px; color:var(--red); margin-bottom:10px; }
  .box-list li { list-style:none; font-size:19px; font-weight:800; padding:7px 0 7px 44px; position:relative; border-top:2px dashed #E3E7F2; }
  .box-list li:first-child { border-top:0; }
  .box-list li::before { content:''; position:absolute; left:4px; top:7px; width:26px; height:26px; border:3px solid var(--navy); border-radius:7px; }

  /* ---------- chapter pages ---------- */
  .band { background:radial-gradient(circle at 80% 0%, #23305A, var(--navy) 70%); color:#fff; height:200px; position:relative; padding:58px 40px 0; }
  .band .tape { top:12px; left:-20px; right:-20px; height:30px; font-size:13px; line-height:30px; transform:rotate(-1.2deg); }
  .band .num { font-family:'Anton'; font-size:96px; line-height:1; color:var(--yellow); float:left; margin-right:20px; }
  .band h2 { font-family:'Anton'; text-transform:uppercase; font-size:56px; line-height:1.02; letter-spacing:.5px; padding-top:6px; }
  .band p { font-size:18px; font-weight:800; color:var(--light); margin-top:2px; }
  .scene { margin:-34px 40px 0; height:300px; border-radius:22px; background:var(--panel); border:4px solid var(--navy); overflow:hidden; position:relative; }
  .scene svg { display:block; }
  .cols { display:grid; grid-template-columns:1.45fr 1fr; gap:22px; padding:26px 40px 0; }
  .lbl { font:900 16px 'Nunito'; letter-spacing:1.5px; color:var(--red); margin-bottom:6px; }
  .rules li { list-style:none; position:relative; padding:8px 0 8px 42px; font-size:18.5px; font-weight:800; line-height:1.32; }
  .rules li b { color:var(--red); }
  .rules li span.n { position:absolute; left:0; top:8px; width:30px; height:28px; border-radius:50%; background:var(--yellow);
                     border:3px solid var(--navy); font:900 14px/22px 'Nunito'; text-align:center; }
  .say { background:var(--yellow); border-radius:18px; padding:18px 18px; box-shadow:0 6px 0 var(--navy); }
  .say .lbl { color:var(--navy); }
  .say div { font-family:'Anton'; text-transform:uppercase; font-size:36px; line-height:1.05; }
  .warn { margin-top:20px; background:var(--red); color:#fff; border-radius:18px; padding:16px 18px; font-size:17px; font-weight:800; line-height:1.35; }
  .warn .lbl { color:var(--yellow); }
  .tips { margin:24px 40px 0; background:var(--navy); color:#fff; border-radius:20px; padding:18px 24px; }
  .tips .lbl { color:var(--yellow); }
  .tips li { list-style:none; position:relative; padding:5px 0 5px 28px; font-size:17px; font-weight:700; line-height:1.35; color:#E8EDFF; }
  .tips li::before { content:'✓'; position:absolute; left:0; top:2px; color:var(--yellow); font-weight:900; }
  .foot { position:absolute; bottom:0; left:0; right:0; height:44px; display:flex; justify-content:space-between; align-items:center;
          padding:0 40px; font-size:13px; font-weight:800; color:#7A84A8; border-top:3px solid var(--yellow); }
  .foot b { background:var(--navy); color:var(--yellow); width:30px; height:30px; border-radius:50%; text-align:center; line-height:30px; }

  /* ---------- intro / extra pages ---------- */
  .pad { padding:28px 40px 0; }
  .note { font-size:17px; font-weight:700; line-height:1.5; }
  .steps { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-top:16px; }
  .steps div { background:var(--panel); border:3px solid var(--navy); border-radius:16px; padding:12px; font-size:14.5px; font-weight:800; line-height:1.3; }
  .steps div i { display:block; font-style:normal; font-family:'Anton'; font-size:30px; color:var(--red); }
  .toc { display:grid; grid-template-columns:1fr 1fr; gap:10px 16px; margin-top:12px; }
  .toc div { display:flex; align-items:center; gap:12px; background:#fff; border:3px solid var(--navy); border-radius:14px; padding:8px 12px; font-weight:900; font-size:17px; }
  .toc div i { font-style:normal; font-family:'Anton'; font-size:26px; background:var(--navy); color:var(--yellow); width:46px; height:46px; border-radius:12px; text-align:center; line-height:46px; flex:none; }
  .toc div small { margin-left:auto; color:#7A84A8; font-size:14px; }
  .nums { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
  .nums div { border-radius:20px; padding:14px; text-align:center; font-weight:900; font-size:17px; letter-spacing:1px; box-shadow:0 6px 0 var(--navy); border:3px solid var(--navy); }
  .nums div b { display:block; font-family:'Anton'; font-size:78px; line-height:1.05; letter-spacing:2px; }
  .card { margin-top:18px; border:4px dashed var(--navy); border-radius:22px; padding:16px 22px; position:relative; }
  .card h3 { font-family:'Anton'; font-size:30px; text-transform:uppercase; }
  .field { display:flex; gap:10px; align-items:flex-end; font-weight:900; font-size:17px; margin-top:20px; }
  .field span { flex:1; border-bottom:2.5px solid #9AA3C4; height:20px; }
  .cert { margin-top:34px; border:8px solid var(--yellow); outline:4px solid var(--navy); border-radius:20px; padding:30px 30px; text-align:center; background:#FFFBE6; }
  .cert h3 { font-family:'Anton'; font-size:54px; text-transform:uppercase; color:var(--navy); }
  .cert p { font-weight:800; font-size:19px; line-height:1.7; margin-top:8px; }
</style>
</head>
<body>
<div id="book"></div>

<script>
/* ---------- drawing helpers ---------- */
const NAVY='#0E1530', N2='#1D2A55', YEL='#FFD000', RED='#FF3B3B';
const rad = a => a*Math.PI/180;

// Cartoon person; (x,y) = feet. la/ra = arm angle from straight down (0) to straight up (180).
function P(o){
  const d = Object.assign({x:0,y:0,s:1,skin:'#C68642',top:RED,bottom:N2,hair:'#2B2118',hs:'short',adult:true,la:15,ra:15,mouth:'smile',dress:false,shades:false}, o);
  const A=d.adult, r=A?26:20, hy=A?-185:-122, sx=A?30:21, sy=A?-145:-96, L=A?75:48, aw=A?13:10;
  let g='';
  if(!d.dress) g += A ? `<g fill="${d.bottom}"><rect x="-22" y="-62" width="14" height="62" rx="7"/><rect x="8" y="-62" width="14" height="62" rx="7"/></g>`
                      : `<g fill="${d.bottom}"><rect x="-16" y="-42" width="12" height="42" rx="6"/><rect x="4" y="-42" width="12" height="42" rx="6"/></g>`;
  if(d.hs==='long') g += `<rect x="${-r*1.1}" y="${hy-r*0.3}" width="${r*2.2}" height="${r*2}" rx="${r*0.8}" fill="${d.hair}"/>`;
  g += A ? (d.dress ? `<path d="M-34 -152 Q0 -168 34 -152 L48 -4 Q0 4 -48 -4 Z" fill="${d.top}"/>` : `<path d="M-34 -152 Q0 -168 34 -152 L40 -56 L-40 -56 Z" fill="${d.top}"/>`)
         : `<path d="M-24 -102 Q0 -114 24 -102 L28 -38 L-28 -38 Z" fill="${d.top}"/>`;
  for (const [side,a] of [[-1,d.la],[1,d.ra]]) {
    const ex = side*(sx + Math.sin(rad(a))*L), ey = sy + Math.cos(rad(a))*L;
    g += `<path d="M${side*sx} ${sy} L${ex.toFixed(1)} ${ey.toFixed(1)}" stroke="${d.skin}" stroke-width="${aw}" stroke-linecap="round"/><circle cx="${ex.toFixed(1)}" cy="${ey.toFixed(1)}" r="${aw*0.62}" fill="${d.skin}"/>`;
  }
  let fr=r;
  if(d.hs==='hijab'){ g += `<path d="M${-r*1.3} ${hy} Q${-r*1.45} ${hy+r*1.9} ${-r*0.5} ${hy+r*2.3} L${r*0.5} ${hy+r*2.3} Q${r*1.45} ${hy+r*1.9} ${r*1.3} ${hy} A${r*1.3} ${r*1.3} 0 0 0 ${-r*1.3} ${hy} Z" fill="${d.hair}"/>`; fr=r*0.88; }
  g += `<circle cx="0" cy="${hy}" r="${fr}" fill="${d.skin}"/>`;
  if(d.hs==='short'||d.hs==='long'||d.hs==='cap')
    g += `<path d="M${-r} ${hy-2} Q${-r} ${hy-r*1.25} 0 ${hy-r*1.12} Q${r} ${hy-r*1.25} ${r} ${hy-2} Q${r*0.55} ${hy-r*0.62} 0 ${hy-r*0.66} Q${-r*0.55} ${hy-r*0.62} ${-r} ${hy-2} Z" fill="${d.hair}"/>`;
  if(d.hs==='cap') g += `<path d="M${-r*1.05} ${hy-r*0.4} Q0 ${hy-r*1.7} ${r*1.05} ${hy-r*0.4} Z" fill="${N2}"/><rect x="${-r*1.05}" y="${hy-r*0.52}" width="${r*2.45}" height="${r*0.24}" rx="3" fill="${N2}"/><circle cx="0" cy="${hy-r*0.85}" r="${r*0.18}" fill="${YEL}"/>`;
  const ey=hy+r*0.05, ex=fr*0.38, er=r*0.12;
  g += d.shades ? `<rect x="${-fr*0.8}" y="${ey-r*0.18}" width="${fr*1.6}" height="${r*0.34}" rx="4" fill="#111"/>`
                : `<circle cx="${-ex}" cy="${ey}" r="${er}" fill="${NAVY}"/><circle cx="${ex}" cy="${ey}" r="${er}" fill="${NAVY}"/>`;
  const my=hy+r*0.42;
  g += {smile:`<path d="M${-r*0.33} ${my} Q0 ${my+r*0.32} ${r*0.33} ${my}" stroke="${NAVY}" stroke-width="${A?3:2.5}" fill="none" stroke-linecap="round"/>`,
        shout:`<ellipse cx="0" cy="${my+r*0.1}" rx="${r*0.2}" ry="${r*0.26}" fill="${NAVY}"/>`,
        flat:`<path d="M${-r*0.25} ${my+r*0.08} L${r*0.25} ${my+r*0.08}" stroke="${NAVY}" stroke-width="2.5" stroke-linecap="round"/>`,
        worried:`<path d="M${-r*0.28} ${my+r*0.2} Q0 ${my-r*0.05} ${r*0.28} ${my+r*0.2}" stroke="${NAVY}" stroke-width="2.5" fill="none" stroke-linecap="round"/>`}[d.mouth];
  return `<g transform="translate(${d.x} ${d.y}) scale(${d.s})">${g}</g>`;
}
// Speech bubble; lines split by '|'; tail points to (tx,ty)
function B(x,y,w,h,text,tx,ty,o={}){
  const fill=o.fill||'#fff', col=o.col||NAVY, fs=o.fs||20, lines=text.split('|'), cx=x+w/2;
  const bx=Math.min(Math.max(tx,x+30),x+w-30);
  let t=lines.map((l,i)=>`<tspan x="${cx}" dy="${i?fs*1.15:0}">${l}</tspan>`).join('');
  const ty0 = y+h/2 - (lines.length-1)*fs*0.575 + fs*0.35;
  return `<path d="M${bx-16} ${y+h-4} L${tx} ${ty} L${bx+16} ${y+h-4} Z" fill="${fill}" stroke="${NAVY}" stroke-width="3"/>
  <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="18" fill="${fill}" stroke="${NAVY}" stroke-width="3"/>
  <rect x="${bx-14}" y="${y+h-6}" width="28" height="6" fill="${fill}"/>
  <text x="${cx}" y="${ty0}" text-anchor="middle" font-family="Nunito" font-weight="900" font-size="${fs}" fill="${col}">${t}</text>`;
}
// Label chip
function C(x,y,text,o={}){ const w=text.length*8.2+26, bg=o.bg||N2, fg=o.fg||YEL;
  return `<rect x="${x}" y="${y}" width="${w}" height="30" rx="10" fill="${bg}"/><text x="${x+w/2}" y="${y+20.5}" text-anchor="middle" font-family="Nunito" font-weight="900" font-size="14.5" fill="${fg}">${text}</text>`; }
function car(x,y,c=N2,s=1){ return `<g transform="translate(${x} ${y}) scale(${s})">
  <path d="M40 52 Q62 0 120 0 L190 0 Q232 0 252 52 Z" fill="${c}"/><rect x="0" y="48" width="280" height="82" rx="26" fill="${c}"/>
  <path d="M70 48 Q86 14 125 14 L150 14 L150 48 Z" fill="#BFD0FF"/><path d="M160 48 L160 14 L182 14 Q212 14 228 48 Z" fill="#BFD0FF"/>
  <rect x="250" y="70" width="22" height="12" rx="4" fill="${YEL}"/><rect x="6" y="70" width="16" height="12" rx="4" fill="${RED}"/>
  <circle cx="64" cy="130" r="25" fill="#111"/><circle cx="64" cy="130" r="10" fill="#9AA3C4"/><circle cx="214" cy="130" r="25" fill="#111"/><circle cx="214" cy="130" r="10" fill="#9AA3C4"/></g>`; }
const heart=(x,y,s=1,c=RED)=>`<path transform="translate(${x} ${y}) scale(${s})" d="M0 0 c-8-12 -26-4 -18 10 l18 16 l18-16 c8-14 -10-22 -18-10z" fill="${c}"/>`;
const svg = inner => `<svg width="706" height="292" viewBox="0 0 706 292" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;

/* ---------- scenes ---------- */
const S = {
body: svg(`<rect y="262" width="706" height="40" fill="#DCE3F7"/>
  ${P({x:230,y:280,adult:false,skin:'#F1C27D',top:YEL,hair:'#6B3E26',ra:165,la:12,mouth:'shout'})}
  ${B(30,22,230,82,'NO!|That\'s my body!',215,150,{fs:24,col:RED})}
  ${heart(360,150,1.6)}
  ${P({x:500,y:280,skin:'#C68642',top:RED,hair:N2,hs:'hijab',dress:true,la:22,ra:22})}
  ${B(400,18,280,74,'I believe you. Thank|you for telling me.',490,95,{fs:18})}
  ${C(560,236,'Safe adult')}`),

stranger: svg(`<rect y="250" width="706" height="50" fill="#C9CCD6"/>
  ${car(20,118)}
  <circle cx="190" cy="152" r="17" fill="#E0AC69"/><rect x="176" y="146" width="28" height="9" rx="3" fill="#111"/><path d="M178 140 Q190 126 204 140 Z" fill="#555"/>
  <path d="M208 160 L292 178" stroke="#E0AC69" stroke-width="10" stroke-linecap="round"/>
  <path d="M287 176 l-14 -9 0 18z M313 176 l14 -9 0 18z" fill="${RED}"/><circle cx="300" cy="176" r="11" fill="${YEL}"/>
  ${B(16,16,280,80,'Want a sweet? Help me|find my lost puppy!',190,128,{fs:18})}
  ${P({x:430,y:282,adult:false,skin:'#8D5524',top:RED,hair:'#111',hs:'long',la:18,ra:18,mouth:'flat'})}
  ${B(338,20,210,74,'I must ask|my dad first!',425,140,{fs:19})}
  <path d="M470 200 L540 200" stroke="${YEL}" stroke-width="10" stroke-linecap="round"/><path d="M536 186 L558 200 L536 214 Z" fill="${YEL}"/>
  ${P({x:625,y:282,skin:'#F1C27D',top:N2,bottom:'#4A5578',hair:'#4A3222',la:20,ra:20})}`),

home: svg(`<rect y="248" width="706" height="50" fill="#E8D9C4"/>
  <rect x="30" y="36" width="150" height="150" rx="6" fill="#BFE3FF" stroke="${NAVY}" stroke-width="8"/>
  <g stroke="${NAVY}" stroke-width="5"><line x1="67" y1="40" x2="67" y2="182"/><line x1="105" y1="40" x2="105" y2="182"/><line x1="143" y1="40" x2="143" y2="182"/></g>
  <rect x="94" y="104" width="22" height="16" rx="3" fill="${YEL}" stroke="${NAVY}" stroke-width="3"/>
  ${C(30,198,'Window locks')}
  <rect x="236" y="96" width="210" height="10" rx="3" fill="${N2}"/>
  <rect x="256" y="48" width="74" height="48" rx="6" fill="${RED}"/><path d="M286 60 h14 v10 h10 v14 h-10 v10 h-14 v-10 h-10 v-14 h10 z" transform="translate(-4 -6) scale(.8) translate(70 15)" fill="#fff"/>
  <rect x="314" y="34" width="26" height="22" rx="7" fill="none" stroke="${YEL}" stroke-width="5"/><rect x="308" y="50" width="38" height="28" rx="5" fill="${YEL}"/>
  <rect x="368" y="56" width="22" height="40" rx="4" fill="#fff" stroke="${NAVY}" stroke-width="3"/><rect x="366" y="48" width="26" height="10" rx="3" fill="${RED}"/>
  <rect x="400" y="62" width="20" height="34" rx="4" fill="#fff" stroke="${NAVY}" stroke-width="3"/><rect x="398" y="54" width="24" height="10" rx="3" fill="${N2}"/>
  ${C(236,114,'Medicines up high & locked')}
  ${P({x:340,y:280,adult:false,skin:'#C68642',top:YEL,hair:'#2B2118',la:55,ra:55})}
  <rect x="268" y="244" width="30" height="30" rx="4" fill="${RED}"/><rect x="384" y="250" width="26" height="26" rx="4" fill="#4FA3FF"/><rect x="396" y="226" width="24" height="24" rx="4" fill="${YEL}" stroke="${NAVY}" stroke-width="2"/>
  <rect x="520" y="70" width="150" height="180" rx="8" fill="${YEL}" stroke="${NAVY}" stroke-width="5"/>
  <g stroke="${NAVY}" stroke-width="4"><line x1="520" y1="130" x2="670" y2="130"/><line x1="520" y1="190" x2="670" y2="190"/></g>
  <g fill="${NAVY}"><rect x="580" y="96" width="30" height="7" rx="3"/><rect x="580" y="156" width="30" height="7" rx="3"/><rect x="580" y="216" width="30" height="7" rx="3"/></g>
  <rect x="540" y="18" width="110" height="52" rx="6" fill="${NAVY}"/><rect x="547" y="24" width="96" height="40" rx="3" fill="#4FA3FF"/>
  <path d="M650 30 L700 30" stroke="${RED}" stroke-width="5"/><rect x="694" y="20" width="10" height="20" fill="#7A84A8"/>
  <path d="M670 100 L700 100" stroke="${RED}" stroke-width="5"/><rect x="694" y="90" width="10" height="20" fill="#7A84A8"/>
  ${C(500,256,'Anchor furniture & TVs')}`),

water: svg(`<rect y="0" width="706" height="190" fill="#DFF2FF"/>
  <rect y="190" width="706" height="16" fill="#E9EEF8"/><rect y="206" width="706" height="100" fill="#4FA3FF"/>
  ${P({x:250,y:345,adult:false,skin:'#F1C27D',top:RED,hair:'#7A4A2A',la:120,ra:120})}
  <rect y="240" width="706" height="90" fill="#3B8EEA" opacity=".93"/>
  <ellipse cx="250" cy="242" rx="50" ry="14" fill="none" stroke="${YEL}" stroke-width="15"/>
  <g fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".8"><path d="M30 246 q20-12 40 0 t40 0"/><path d="M420 262 q20-12 40 0 t40 0"/><path d="M560 230 q20-12 40 0 t40 0"/></g>
  ${P({x:420,y:200,s:.85,skin:'#8D5524',top:N2,bottom:'#4A5578',hair:'#111',la:15,ra:35})}
  <rect x="406" y="86" width="28" height="16" rx="4" fill="${YEL}"/><text x="420" y="97.5" text-anchor="middle" font-family="Nunito" font-weight="900" font-size="8" fill="${NAVY}">WATCHER</text>
  <rect x="600" y="40" width="34" height="58" rx="7" fill="${N2}"/><rect x="605" y="48" width="24" height="40" rx="3" fill="#BFD0FF"/>
  <circle cx="617" cy="69" r="36" fill="none" stroke="${RED}" stroke-width="8"/><line x1="592" y1="44" x2="642" y2="94" stroke="${RED}" stroke-width="8"/>
  ${C(486,118,'Phone away, eyes on')}
  ${B(18,18,240,74,'Eyes on you,|every second.',398,58,{fs:19})}`),

hotcar: svg(`<rect width="706" height="292" fill="#FFF1C4"/><rect y="244" width="706" height="60" fill="#8A8FA3"/>
  <circle cx="640" cy="52" r="38" fill="${YEL}"/><g stroke="${YEL}" stroke-width="7" stroke-linecap="round"><line x1="640" y1="0" x2="640" y2="6"/><line x1="586" y1="52" x2="580" y2="52"/><line x1="602" y1="14" x2="596" y2="8"/><line x1="602" y1="90" x2="596" y2="96"/></g>
  <rect x="40" y="40" width="26" height="170" rx="13" fill="#fff" stroke="${NAVY}" stroke-width="4"/><rect x="47" y="64" width="12" height="140" rx="6" fill="${RED}"/><circle cx="53" cy="214" r="24" fill="${RED}" stroke="${NAVY}" stroke-width="4"/>
  ${car(120,114,RED)}
