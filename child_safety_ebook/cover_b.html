<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Safety Superheroes</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:#ddd; font-family:'Nunito',sans-serif; }
  .page { width:794px; height:1123px; margin:0 auto; position:relative; overflow:hidden;
          background:linear-gradient(#6EC6FF 0%, #B9E6FF 55%, #E8F7FF 70%); }
  .top { position:absolute; top:34px; left:0; right:0; text-align:center; }
  .pill { display:inline-block; background:#FF4F5E; color:#fff; font-weight:900; font-size:19px; letter-spacing:2px;
          padding:9px 22px; border-radius:30px; border:4px solid #fff; box-shadow:0 5px 0 #C9303D; }
  h1 { font-family:'Lilita One',sans-serif; text-align:center; line-height:.92; margin-top:22px;
       font-size:120px; color:#FFD23F; -webkit-text-stroke:8px #2B2D6E; paint-order:stroke fill;
       text-shadow:0 10px 0 #2B2D6E; }
  h1 small { display:block; font-size:72px; color:#fff; }
  .sub { text-align:center; font-size:24px; font-weight:900; color:#2B2D6E; margin-top:20px; }
  .scene { position:absolute; left:0; bottom:0; }
  .box { position:absolute; left:50px; right:50px; bottom:40px; background:#fff; border-radius:24px; padding:18px 24px;
         border:5px solid #2B2D6E; box-shadow:0 8px 0 #2B2D6E; display:flex; gap:16px; align-items:center; }
  .box .ic { flex:none; width:58px; height:58px; border-radius:16px; background:#FF4F5E; color:#fff;
             font:400 40px/58px 'Lilita One'; text-align:center; transform:rotate(-6deg); }
  .box p { font-size:19px; font-weight:800; color:#2B2D6E; line-height:1.35; }
  .box b { color:#FF4F5E; }
</style>
</head>
<body>
<div class="page">
  <div class="top">
    <span class="pill">THE FAMILY SAFETY BOOK &bull; AGES 4–10</span>
    <h1><small>Be a</small>Safety<br>Superhero!</h1>
    <p class="sub">Fun rules that protect your child at home, outside and online</p>
  </div>

      <circle cx="660" cy="60" r="22"/><circle cx="690" cy="48" r="30"/><circle cx="720" cy="62" r="20"/><rect x="660" y="62" width="60" height="20" rx="10"/></g>
    <!-- hills and houses -->
    <path d="M0 300 Q200 220 400 290 Q600 230 794 290 L794 640 L0 640 Z" fill="#7BD389"/>
    <path d="M0 340 Q260 290 520 335 Q680 310 794 330 L794 640 L0 640 Z" fill="#5BBF6E"/>
    <g><rect x="70" y="250" width="90" height="70" fill="#FFB347"/><path d="M60 254 L115 210 L170 254 Z" fill="#FF4F5E"/><rect x="104" y="284" width="22" height="36" fill="#2B2D6E"/></g>
    <g><rect x="640" y="252" width="90" height="70" fill="#C49BFF"/><path d="M630 256 L685 212 L740 256 Z" fill="#2B2D6E"/><rect x="674" y="286" width="22" height="36" fill="#FFD23F"/></g>
    <!-- road with zebra crossing -->
    <path d="M0 400 L794 400 L794 520 L0 520 Z" fill="#4A4E69"/>
    <g fill="#fff"><rect x="300" y="412" width="200" height="14" rx="3"/><rect x="300" y="438" width="200" height="14" rx="3"/><rect x="300" y="464" width="200" height="14" rx="3"/><rect x="300" y="490" width="200" height="14" rx="3"/></g>
    <g fill="#FFD23F"><rect x="30" y="456" width="70" height="8" rx="4"/><rect x="150" y="456" width="70" height="8" rx="4"/><rect x="580" y="456" width="70" height="8" rx="4"/><rect x="700" y="456" width="70" height="8" rx="4"/></g>
    <!-- pavement -->
    <rect x="0" y="380" width="794" height="22" fill="#C9CCD6"/>
    <!-- stop sign -->
    <rect x="566" y="250" width="10" height="140" fill="#8A8FA3"/>
    <path d="M553 196 L589 196 L614 221 L614 257 L589 282 L553 282 L528 257 L528 221 Z" fill="#FF4F5E" stroke="#fff" stroke-width="5"/>

    <!-- parent -->
    <g>
      <rect x="380" y="320" width="16" height="64" rx="8" fill="#2B2D6E"/><rect x="404" y="320" width="16" height="64" rx="8" fill="#2B2D6E"/>
      <path d="M366 236 Q400 220 434 236 L440 326 L360 326 Z" fill="#00A6A6"/>
      <circle cx="400" cy="200" r="28" fill="#C68642"/>
      <path d="M372 202 Q370 166 400 166 Q430 166 428 202 Q432 232 420 236 Q424 190 400 184 Q376 190 380 236 Q368 232 372 202 Z" fill="#3B2416"/>
      <circle cx="391" cy="204" r="3.5" fill="#2B2D6E"/><circle cx="409" cy="204" r="3.5" fill="#2B2D6E"/>
      <path d="M390 214 Q400 222 410 214" stroke="#2B2D6E" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M366 248 Q346 280 332 300" stroke="#C68642" stroke-width="14" stroke-linecap="round" fill="none"/>
      <path d="M434 248 Q454 280 468 300" stroke="#C68642" stroke-width="14" stroke-linecap="round" fill="none"/>
    </g>
    <!-- child left with cape -->
    <g>
      <path d="M296 284 Q270 330 280 370 L350 352 Q340 310 322 284 Z" fill="#FF4F5E"/>
      <rect x="300" y="340" width="12" height="44" rx="6" fill="#2B2D6E"/><rect x="316" y="340" width="12" height="44" rx="6" fill="#2B2D6E"/>
      <path d="M292 290 Q314 278 336 290 L340 346 L288 346 Z" fill="#FFD23F"/>
      <path d="M306 304 L314 296 L322 304 L314 316 Z" fill="#FF4F5E"/>
      <circle cx="314" cy="262" r="22" fill="#F1C27D"/>
      <path d="M292 260 Q294 232 314 236 Q336 232 336 260 Q326 246 314 248 Q300 246 292 260 Z" fill="#7A4A2A"/>
      <circle cx="307" cy="264" r="3" fill="#2B2D6E"/><circle cx="321" cy="264" r="3" fill="#2B2D6E"/>
      <path d="M306 273 Q314 280 322 273" stroke="#2B2D6E" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M336 300 Q334 300 332 300" stroke="#F1C27D" stroke-width="11" stroke-linecap="round"/>
    </g>
    <!-- child right with cape -->
    <g>
      <path d="M504 284 Q530 330 520 370 L450 352 Q460 310 478 284 Z" fill="#8E5CFF"/>
      <rect x="472" y="340" width="12" height="44" rx="6" fill="#2B2D6E"/><rect x="488" y="340" width="12" height="44" rx="6" fill="#2B2D6E"/>
      <path d="M462 290 Q486 278 510 290 L516 348 L456 348 Z" fill="#FF8FB1"/>
      <path d="M478 304 L486 296 L494 304 L486 316 Z" fill="#8E5CFF"/>
      <circle cx="486" cy="262" r="22" fill="#8D5524"/>
      <path d="M462 266 Q458 232 486 234 Q514 232 510 266 Q514 288 504 290 Q508 254 486 248 Q464 254 468 290 Q458 288 462 266 Z" fill="#1B1B1B"/>
      <circle cx="479" cy="264" r="3" fill="#2B2D6E"/><circle cx="493" cy="264" r="3" fill="#2B2D6E"/>
      <path d="M478 273 Q486 280 494 273" stroke="#2B2D6E" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    </g>
    <!-- stars -->
    <g fill="#FFD23F"><path d="M230 160 l8 16 18 3 -13 12 3 18 -16-9 -16 9 3-18 -13-12 18-3z"/><path d="M560 120 l6 12 13 2 -10 9 2 13 -11-6 -11 6 2-13 -10-9 13-2z"/></g>
  </svg>

  <div class="box">
    <div class="ic">!</div>
    <p>Accidents happen in <b>seconds</b>. A child who knows the rules knows what to do. <b>Read it together tonight.</b></p>
  </div>
</div>
</body>
</html>
